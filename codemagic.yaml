workflows:
  android-debug:
    name: Build Lightning Debug
    instance_type: linux  # <-- بدلناه من mac_mini_m1 الى linux
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Grant permission
        script: chmod +x ./gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
