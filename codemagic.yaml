workflows:
  android-release:
    name: Build Lightning APK
    instance_type: linux
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Grant permission
        script: chmod +x ./gradlew
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
