workflows:
  android-release:  # <-- بدل الاسم هذا
    name: Build Lightning Release
    instance_type: linux
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Grant permission
        script: chmod +x ./gradlew
      - name: Build APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
