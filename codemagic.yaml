workflows:
  android-release:
    name: Build LkBrowser APK
    instance_type: linux  # مهم جدا: linux ماشي mac
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Build Debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
